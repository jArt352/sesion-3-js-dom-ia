<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sesion 3 - JavaScript, DOM, APIs y desarrollo asistido por IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="progress-bar"></div>
<div class="bloque-tag" id="bloque-tag"></div>

<div id="top-controls">
    <button class="icon-btn" id="btn-index" title="Indice (G)">Indice</button>
    <button class="icon-btn" id="btn-instructor" title="Modo instructor (I)">Modo instructor</button>
</div>

<div id="slides"></div>

<div id="toolbar">
    <button class="nav-btn" id="btn-prev" title="Anterior (Flecha izquierda)">&#8592;</button>
    <div id="slide-counter">01 / 01</div>
    <button class="nav-btn" id="btn-next" title="Siguiente (Flecha derecha / Espacio)">&#8594;</button>
</div>

<div id="index-panel">
    <div class="index-modal">
        <div class="index-modal-header">
            <h2>Indice de la sesion</h2>
            <button class="icon-btn" id="btn-close-index">Cerrar</button>
        </div>
        <div class="index-list" id="index-list"></div>
    </div>
</div>

<div id="instructor-panel">
    <div class="instructor-header">Nota del instructor</div>
    <div class="instructor-body" id="instructor-body"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/config.js"></script>
<script src="js/highlight.js"></script>
<script src="js/helpers.js"></script>
<script src="js/slides-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
